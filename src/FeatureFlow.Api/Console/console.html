<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feature Flow</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; color: #1d1d1f; }
    header { display: flex; gap: 1em; align-items: center; padding: .6em 1em; background: #24292f; color: #fff; }
    header a { color: #fff; font-weight: 600; text-decoration: none; }
    header form { margin-left: auto; display: flex; gap: .4em; }
    main { padding: 1em; max-width: 1200px; }
    table { border-collapse: collapse; width: 100%; margin: .5em 0 1.5em; }
    th, td { text-align: left; padding: .25em .6em; border-bottom: 1px solid #ddd; vertical-align: top; }
    th { background: #f6f8fa; }
    pre { background: #f6f8fa; padding: .8em; overflow-x: auto; font-size: 12px; }
    .wait { border: 1px solid #d0d7de; border-radius: 6px; padding: .6em .8em; margin: .5em 0; }
    .wait button, .wait select, .wait input { margin: .2em .3em .2em 0; }
    .status-completed { color: #1a7f37; } .status-failed, .status-aborted, .status-incomplete, .status-rejected { color: #cf222e; }
    .error { color: #cf222e; } .note { color: #57606a; }
    dl { display: grid; grid-template-columns: max-content auto; gap: .2em 1em; }
    dt { font-weight: 600; }
  </style>
  <script src="/console/console.js" defer></script>
</head>
<body>
  <header>
    <a href="#/runs">Feature Flow</a>
    <form id="sign-in">
      <input id="token" type="password" placeholder="API token" autocomplete="off" aria-label="API token">
      <button type="submit">Use token</button>
    </form>
  </header>
  <main id="main"><p class="note">Enter your API token to see runs.</p></main>
</body>
</html>
