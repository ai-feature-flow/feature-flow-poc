api_version: feature-flow/v1
kind: workflow_test
name: ticket_replan_recovery
description: >-
  The planner reports blocked and the run escalates at it. A person answers
  with replan at the planner, which has planning (LOG 509), so the answer is
  accepted: the planner runs again, the plan is approved and the ticket merges.
template: std:templates/ticket_delivery
parameters: { ticket_id: FF-1042 }
repositories: [acme/api]

script:
  plan.plan: [blocked, planned]
answers:
  plan.plan: { replan: plan.plan }

expect:
  status: completed
  path_includes: [plan.plan, plan.plan, plan.validate, approve_spec, implement, deliver.merge]
  executions: { plan.plan: 2, approve_spec: 1 }
