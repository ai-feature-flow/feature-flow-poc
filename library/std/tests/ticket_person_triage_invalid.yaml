api_version: feature-flow/v1
kind: workflow_test
name: ticket_person_triage_invalid
description: >-
  A person's triage names a finding the ledger does not hold: findings.triage
  applies nothing (invalid) and the decision is asked again; the second triage
  applies and leaves the finding open for the fixer.
template: std:templates/ticket_delivery
parameters: { ticket_id: FF-1042 }
repositories: [acme/api]

script:
  verify.fix.apply_person_triage: [invalid, applied]
outputs:
  verify.fix.apply_triage: { escalated: 1, declined_blocking: 0 }
  "findings.open_blocking": [1, 0]
  "findings.open": 1

expect:
  status: completed
  path_includes:
    - verify.fix.person_triage
    - verify.fix.apply_person_triage
    - verify.fix.person_triage
    - verify.fix.apply_person_triage
    - verify.fix.fix
    - deliver.merge
  executions:
    verify.fix.person_triage: 2
    verify.fix.apply_person_triage: 2
