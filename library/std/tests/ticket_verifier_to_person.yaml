api_version: feature-flow/v1
kind: workflow_test
name: ticket_verifier_to_person
description: >-
  The verifying reviewer's verdict declines a blocking finding (possible only
  where record_fixes' states allow it). findings.triage counts it, and a person
  triages it in a decision before any merge (LOG 248); this one escalates.
template: std:templates/ticket_delivery
parameters: { ticket_id: FF-1042 }
repositories: [acme/api]

script:
  verify.fix.person_triage: escalate
outputs:
  verify.fix.record_fixes: { escalated: 0, declined_blocking: 1 }
  "findings.open_blocking": [1]
  "findings.open": 1

expect:
  status: running
  path_includes:
    - verify.fix.fix
    - verify.fix.verify_fix
    - verify.fix.record_fixes
    - verify.fix.person_triage
  escalated: [verify.fix.person_triage]
  executions:
    verify.fix.tests_added: 0
    deliver.merge: 0
