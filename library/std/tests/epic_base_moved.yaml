api_version: feature-flow/v1
kind: workflow_test
name: epic_base_moved
description: >-
  The epic's merge into its parent loses a race (base_moved) to a sibling epic.
  The catch-up changes the branch, so the epic is re-tested and its checks run
  again; the second merge lands.
template: std:templates/epic_delivery
parameters: { epic_name: billing, engine_can_merge: true }
repositories: [acme/api]

expand:
  tickets.expand: [{ name: invoice_totals, repositories: [acme/api] }]
script:
  deliver.merge: [base_moved, merged]
outputs:
  deliver.catch_up: [{ changed: false }, { changed: true }, { changed: false }]

expect:
  status: completed
  path_includes:
    - deliver.catch_up
    - deliver.merge
    - deliver.catch_up
    - deliver.retest
    - deliver.checks
    - deliver.catch_up
    - deliver.merge
  executions:
    deliver.merge: 2
    deliver.retest: 1
