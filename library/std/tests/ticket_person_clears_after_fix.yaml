api_version: feature-flow/v1
kind: workflow_test
name: ticket_person_clears_after_fix
description: >-
  The first pass of the fix loop fixes a finding, and the change is tested and
  reviewed again. The second review raises another; the triager escalates it,
  and a person declines it. Nothing is open and no fixer ran in this pass, so
  the loop leaves by cleared, though a fixer ran in the first pass (LOG 518):
  the change is not tested again, and the run goes on to the satisfaction check
  and merges.
template: std:templates/ticket_delivery
parameters: { ticket_id: FF-1046 }
repositories: [acme/api]

outputs:
  verify.fix.fix: { commits: 1 }
  verify.fix.apply_triage: [{ escalated: 0, declined_blocking: 0 }, { escalated: 1, declined_blocking: 0 }]
  verify.fix.apply_person_triage: { escalated: 0, declined_blocking: 1 }
  "findings.open": [1, 1, 0]            # pass 1's triage applied; its fix; the person's triage in pass 2
  "findings.open_blocking": [1]         # the merge bar, evaluated twice

expect:
  status: completed
  path_includes:
    - verify.fix.apply_triage
    - verify.fix.fix
    - verify.fix.tests_added
    - verify.tests
    - verify.review.review_0.assess
    - verify.fix.apply_triage
    - verify.fix.person_triage
    - verify.fix.apply_person_triage
    - verify.satisfaction
    - deliver.merge
  executions:
    verify.fix.fix: 1
    verify.fix.person_triage: 1
    verify.tests: 2
    verify.review.review_0.assess: 2
    verify.satisfaction: 1
