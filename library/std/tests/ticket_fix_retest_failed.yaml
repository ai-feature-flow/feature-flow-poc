api_version: feature-flow/v1
kind: workflow_test
name: ticket_fix_retest_failed
description: >-
  The fix loop's re-test fails after the first fix, so the fixer goes again;
  the second fix passes its re-test and its regression tests are validated, so
  the loop leaves by its fixed exit and the ticket merges.
template: std:templates/ticket_delivery
parameters: { ticket_id: FF-1043 }
repositories: [acme/api]

script:
  verify.fix.retest: [failed, passed]
outputs:
  "findings.open": 1
  "findings.open_blocking": [1, 0]

expect:
  status: completed
  path_includes:
    - verify.fix.fix
    - verify.fix.record_fixes
    - verify.fix.retest
    - verify.fix.fix
    - verify.fix.record_fixes
    - verify.fix.retest
    - verify.fix.tests_added
    - verify.tests
    - deliver.merge
  executions:
    verify.fix.fix: 2
    verify.fix.retest: 2
    verify.fix.tests_added: 1
