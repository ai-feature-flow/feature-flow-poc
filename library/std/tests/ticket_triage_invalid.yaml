api_version: feature-flow/v1
kind: workflow_test
name: ticket_triage_invalid
description: >-
  The first triage names a finding the ledger does not hold, so findings.triage
  applies nothing and the triage goes back to the triager. The verifying
  reviewer's first verdict is invalid in the same way and goes back to it. The
  second of each applies, and the ticket merges.
template: std:templates/ticket_delivery
parameters: { ticket_id: FF-1042 }
repositories: [acme/api]

script:
  verify.fix.apply_triage: [invalid, applied]
  verify.fix.record_fixes: [invalid, applied]
outputs:
  verify.fix.triage: { to_fix: 1, escalated: 0 }
  "findings.open_blocking": [1, 0]

expect:
  status: completed
  path_includes:
    - verify.fix.triage
    - verify.fix.apply_triage
    - verify.fix.triage
    - verify.fix.apply_triage
    - verify.fix.fix
    - verify.fix.verify_fix
    - verify.fix.record_fixes
    - verify.fix.verify_fix
    - verify.fix.record_fixes
    - verify.fix.tests_added
    - deliver.merge
  executions:
    verify.fix.triage: 2
    verify.fix.apply_triage: 2
    verify.fix.verify_fix: 2
    verify.fix.record_fixes: 2
