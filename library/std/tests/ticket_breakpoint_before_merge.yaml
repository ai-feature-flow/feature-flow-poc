api_version: feature-flow/v1
kind: workflow_test
name: ticket_breakpoint_before_merge
description: >-
  A person sets a breakpoint on the merge. The run pauses before it with a
  breakpoint decision and nothing merges; the person answers continue, the
  merge runs once and the ticket completes.
template: std:templates/ticket_delivery
parameters: { ticket_id: FF-1042 }
repositories: [acme/api]

overrides:
  - { breakpoint: deliver.merge }
answers:
  deliver.merge: continue

expect:
  status: completed
  path_includes: [deliver.catch_up, deliver.merge]
  executions: { deliver.merge: 1 }
