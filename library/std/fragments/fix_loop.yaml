api_version: feature-flow/v1
kind: fragment
metadata:
  name: fix_loop
  description: >-
    A triager decides per open finding; the decisions are applied, and an
    escalation or a declined blocking or demonstrated finding goes to a person,
    who triages in a decision (any state, recorded as that person); a fixer fixes
    what is left open, with regression tests; a verifying reviewer checks each fix
    against its finding on the full diff; the fix is re-tested and its regression
    tests are validated as new and passing. The caller re-tests and re-reviews after the fixed exit;
    the cleared exit, nothing open after the pass's triage and no fixer run in it, changed no code, so the caller goes on to its merge bar.

parameters:
  fixer_task: { type: reference, default: std:tasks/fix_findings }
  triager_task: { type: reference, default: std:tasks/triage_findings }
  tier_tags: { type: array, default: [] }

exits:
  fixed: success                        # nothing open after a fix: the caller re-tests and re-reviews
  cleared: success                      # nothing open after the pass's triage, before any fixer: no code changed (LOG 503, 518)
  escalated: blocked

defaults:
  routes:
    by_class: { blocked: { exit: escalated } }   # a blocked triager or fixer leaves by the escalated exit

artifact_types:
  - std:artifact_types/findings_report
  - std:artifact_types/triage
  - std:artifact_types/evidence_claims
  - std:artifact_types/validation_report
  - std:artifact_types/test_results

steps:
  - id: triage
    agent:
      role: std:roles/triager
      task: { param: triager_task }
      skills: [std:skills/review]
    consumes: [{ name: findings_ledger }, { name: test_results, optional: true }]   # the engine's tests check a demonstrated claim (LOG 516)
    produces:
      triaged: [{ name: triage, type: std:artifact_types/triage }]
    outcomes: { triaged: success, blocked: blocked }

  - id: apply_triage
    action: findings.triage
    with: { from: triage, states: [open, declined, escalated] }   # only the verifier, after a fix, may set fixed
    consumes: [{ name: triage }]
    routes:
      applied:                                    # on the engine's counts, never the triager's own outputs
        - when: "steps.apply_triage.outputs.escalated > 0 || steps.apply_triage.outputs.declined_blocking > 0 || steps.apply_triage.outputs.declined_demonstrated > 0"
          to: person_triage                       # the classes apply_person_triage names: an escalation, or a declined blocking or demonstrated finding
        - when: "findings.open == 0"
          to: { exit: cleared }                   # the loop's first decision: nothing has been fixed in this pass
        - to: fix
      invalid: triage                             # names a finding the ledger does not hold: back to its producer

  - id: person_triage                   # what the agent alone may not clear (LOG 168), a person triages (LOG 248)
    decision:
      type: findings.triage
      prompt: std:prompts/findings_triage
    consumes: [{ name: findings_ledger }, { name: triage }]
    produces:
      triaged: [{ name: person_triage, type: std:artifact_types/triage }]
    outcomes: { triaged: success, escalate: blocked }
    routes:
      escalate: { exit: escalated }

  - id: apply_person_triage
    action: findings.triage
    with:                                         # any state, recorded as the person (F8)
      from: person_triage
      complete: true                              # it must decide every finding of the run in the classes person_decides names
      person_decides: [escalated, declined_blocking, declined_demonstrated]   # std's policy: what the agent alone may not clear (LOG 168)
    consumes: [{ name: person_triage }]
    routes:
      applied:
        - when: "steps.apply_person_triage.outputs.escalated > 0"
          to: { exit: escalated }                 # the person escalates beyond this loop
        - when: "findings.open == 0"
          to: { exit: cleared }                   # the person is reached only before a fixer in this pass, so no code changed (LOG 518)
        - to: fix
      invalid: person_triage                      # names a finding the ledger does not hold: back to the person

  - id: fix
    agent:
      role: std:roles/fixer
      task: { param: fixer_task }
      skills: [std:skills/review, std:skills/verification]
    with: { tier_tags: { expr: "params.tier_tags" } }
    consumes:
      - { name: findings_ledger }
      - { name: triage }
      - { name: person_triage, optional: true }   # a person's decisions, over the triager's (LOG 248)
      - { name: implementation_claims, optional: true }
      - { name: fix_verification, optional: true }
      - { name: fix_test_results, optional: true }   # a failed re-test's results: what sent the fixer back (LOG 517)
      - { name: fix_validation, optional: true }     # an invalid regression-test validation, likewise
    produces:
      fixed:
        - { name: fix_claims, type: std:artifact_types/evidence_claims }
        - { name: implementation_claims, type: std:artifact_types/evidence_claims }
    outcomes: { fixed: success, blocked: blocked }
    routes:
      fixed:                                      # LOG 517
        - when: "steps.fix.outputs.commits == 0"
          to: { escalate: true }                  # a fix that changed nothing: a person decides, rather than verifying nothing
        - when: "findings.open == 0"
          to: retest                              # sent back by the re-test or validation, not by a finding: nothing for verify_fix
        - to: verify_fix

  - id: verify_fix
    agent:
      role: std:roles/reviewer
      task: std:tasks/verify_fix
      skills: [std:skills/review]
      context: none
    consumes:
      - { name: findings_ledger }
      - { name: triage }
      - { name: person_triage, optional: true }
      - { name: fix_claims }
    produces:
      verified: [{ name: fix_verification, type: std:artifact_types/triage }]
      not_fixed: [{ name: fix_verification, type: std:artifact_types/triage }]
    verdicts: { verified: { accept: [fix_claims] }, not_fixed: { reject: [fix_claims] } }
    outcomes: { verified: success, not_fixed: failure }
    routes: { not_fixed: fix }

  - id: record_fixes
    action: findings.triage
    with: { from: fix_verification, states: [fixed, open] }   # never escalated or declined, so a person is reached only before a fixer (LOG 518)
    consumes: [{ name: fix_verification }]
    routes:
      applied: retest
      invalid: verify_fix

  - id: retest                          # tests_added counts only tests the engine saw pass at the fixed head
    action: test.run
    with: { tier_tags: { expr: "params.tier_tags" } }
    produces:                           # not test_results: verify.repair reads that. On both outcomes: a failure's results go back to the fixer
      passed: [{ name: fix_test_results, type: std:artifact_types/test_results }]
      failed: [{ name: fix_test_results, type: std:artifact_types/test_results }]
    routes:
      failed: fix
      baseline_failed: { exit: escalated }

  - id: tests_added
    action: artifact.validate
    with:
      validation:
        - { validator: tests_added, subjects: [fix_claims, triage, { name: person_triage, optional: true }] }
    consumes: [{ name: fix_claims }, { name: triage }, { name: person_triage, optional: true }]
    produces:                                   # on both outcomes: an invalid result's report goes back with the route
      valid: [{ name: fix_validation, type: std:artifact_types/validation_report }]
      invalid: [{ name: fix_validation, type: std:artifact_types/validation_report }]
    routes:
      valid: { exit: fixed }
      invalid: fix
