api_version: feature-flow/v1
kind: artifact_type
metadata:
  name: merge_record
  description: >-
    Who merged, the method (merge or squash), the head merged, the parent revision it replaced and the resulting commit. Read by delivery.report.

format: json
evidence: true          # only engine actions may produce it (docs/01 section 5.2, F7)
produced_by: [scm.merge]
compatible_with: []
validators: []
schema: engine          # the shape is the engine's contract (docs/04), not library content
