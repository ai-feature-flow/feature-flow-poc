# While main development goes on (product owner, 2026-11-07), a pull request runs only the default category; the
# integration and cluster categories run on every push to main, when started by hand, or on a pull request labelled
# `full-ci` (use it for workflow code, providers or deploy/). When main development finishes, run all three on every
# pull request again and make them required (docs/11 section 4.1). The live category, which needs a real agent runtime
# and the GitHub App, is excluded here. Each test is listed in the job's log
# (console verbosity normal), so what a job ran can be read from it.
#
# Where each test type of docs/09 section 4.2 runs:
#   validation, re-drive, readable form, replay      default (FeatureFlow.Validation.Tests, Testing.Workflows.Tests, Replay.Tests)
#   run-time rules                                   default (Engine.Tests) and integration (PolicyRunTests, StepStartCheckTests)
#   provider contracts                               default (in-process providers), integration (Docker, and Postgres and
#                                                    MinIO in containers), cluster (the Kubernetes pod sandbox)
#   failure injection                                integration: worker crash (AgentResumeTests), lost sandbox and hook
#                                                    endpoint unreachable (AgentBoundaryTests), Temporal unavailable
#                                                    (TemporalOutageTests), continue-as-new with children and open decisions
#                                                    (ContinueAsNewTests, EpicRunTests); default: stale patch (PatchTests),
#                                                    hook endpoint unreachable (SandboxClientTests)
#   merge race, agent reporting, pre-submit parity   integration (MergeRaceTests, EngineMergeRaceTests, AgentContractTests,
#                                                    SessionRunTests)
#   the deployment: images, network policies, stop  cluster (Cluster/DeploymentTests) and integration (HostProcessTests)
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  default:
    name: Build and default tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build FeatureFlow.slnx -c Release
      - run: dotnet test FeatureFlow.slnx -c Release --no-build --filter "Category!=Integration&Category!=Live&Category!=Cluster" --logger "console;verbosity=normal"

  integration:
    name: Integration tests
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    env:
      FF_TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install the Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
      - name: Start the Temporal dev server
        run: |
          nohup temporal server start-dev --headless --port 7233 > "$RUNNER_TEMP/temporal.log" 2>&1 &
          for i in $(seq 60); do
            temporal operator cluster health --address "$FF_TEMPORAL_ADDRESS" 2>/dev/null | grep -q SERVING && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/temporal.log"
          exit 1
      - run: docker version
      # The agent step tests run Claude Code and Copilot CLI in this image against a scripted model; no model credential is used.
      - name: Build the sandbox image
        run: docker build -q -t feature-flow-sandbox:m8 -f src/Providers/FeatureFlow.Providers.Docker/sandbox.Dockerfile src/Providers/FeatureFlow.Providers.Docker
      - run: dotnet build FeatureFlow.slnx -c Release
      - run: dotnet test FeatureFlow.slnx -c Release --no-build --filter "Category=Integration" --logger "console;verbosity=normal"

  cluster:
    name: Cluster tests
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    env:
      FF_K3D_CLUSTER: ff-ci
      # The sandbox image deploy/k3d/up.sh imports, for the sandbox contract's pods.
      FF_SANDBOX_IMAGE: feature-flow-sandbox:dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install k3d
        run: curl -sSf https://raw.githubusercontent.com/k3d-io/k3d/v5.9.0/install.sh | TAG=v5.9.0 bash
      # The k3d profile with the smoke configuration: Temporal, Postgres and MinIO in the cluster, the three host images
      # built here, fake providers outside the cluster (deploy/README.md).
      - name: Bring up the k3d deployment
        run: |
          echo "FF_KUBECONFIG=$RUNNER_TEMP/ff-ci.kubeconfig" >> "$GITHUB_ENV"
          FF_KUBECONFIG="$RUNNER_TEMP/ff-ci.kubeconfig" deploy/k3d/up.sh deploy/k3d/smoke
      - run: dotnet build FeatureFlow.slnx -c Release
      - run: dotnet test FeatureFlow.slnx -c Release --no-build --filter "Category=Cluster" --logger "console;verbosity=normal"
      - name: Show the cluster's state
        if: failure()
        run: |
          kubectl --kubeconfig "$FF_KUBECONFIG" get pods -A
          for d in api orchestration-worker agent-worker; do
            kubectl --kubeconfig "$FF_KUBECONFIG" -n feature-flow logs "deployment/$d" --tail 100 || true
          done
