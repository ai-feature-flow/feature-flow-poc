api_version: feature-flow/v1
kind: template
metadata:
  name: steer_parent
  level: epic
  description: A parent running one steer_line child, for a library override that reaches a running child.

parameters:
  wait_ms: { type: number, default: 0, description: "Inherited by the child" }

defaults:
  routes:
    by_class: { failure: { escalate: true }, blocked: { escalate: true } }

steps:
  - id: kid
    action: run.child
    with: { template: m7steer:templates/steer_line, level: ticket, repositories: [acme/api], parameters: {} }
    routes: { completed: { end: completed } }
