api_version: feature-flow/v1
kind: template
metadata:
  name: steer_pr_parent
  level: epic
  description: >-
    A parent whose child opens a pull request and ends, then holds, so aborting the parent can close the pull request of a
    child that has already ended.

parameters:
  wait_ms: { type: number, default: 0, description: "How long the parent holds" }

defaults:
  routes:
    by_class: { failure: { escalate: true }, blocked: { escalate: true } }

steps:
  - id: kid
    action: run.child
    with: { template: m7steer:templates/steer_pr, level: ticket, repositories: [acme/api], parameters: { wait_ms: 0 } }
  - id: hold
    action: notify.send
    with: { audience: [team], message: hold, wait_ms: { expr: "params.wait_ms" } }
    routes: { sent: { end: completed } }
