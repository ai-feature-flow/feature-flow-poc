api_version: feature-flow/v1
kind: template
metadata:
  name: steer_pr_parent
  level: epic
  description: >-
    A parent whose child opens a pull request and ends, then holds, so aborting the parent can close the pull request of a
    child that has already ended.

parameters:
  wait_ms: { type: number, default: 0, description: "How long the parent holds" }
  kid_wait_ms: { type: number, default: 0, description: "How long the child holds" }

defaults:
  routes:
    by_class: { failure: { escalate: true }, blocked: { escalate: true } }

steps:
  - id: kid
    action: run.child
    with: { template: m7steer:templates/steer_pr, repositories: [acme/api], parameters: { wait_ms: { expr: "params.kid_wait_ms" } } }
  - id: hold
    agent: { role: std:roles/reviewer, task: m7steer:tasks/review }     # the scripted runtime holds it for wait_ms
    with: { wait_ms: { expr: "params.wait_ms" } }
    outcomes: { held: success }
    routes: { held: { end: completed } }
