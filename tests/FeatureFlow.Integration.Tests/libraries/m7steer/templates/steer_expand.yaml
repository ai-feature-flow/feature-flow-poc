api_version: feature-flow/v1
kind: template
metadata:
  name: steer_expand
  level: epic
  description: A run with no run.child step until plan.expand adds them, so an override in it may still reach children.

artifact_types:
  - std:artifact_types/work_list

defaults:
  routes:
    by_class: { failure: { escalate: true }, blocked: { escalate: true } }

steps:
  - id: plan
    agent: { role: std:roles/planner, task: m7steer:tasks/plan }
    produces:
      planned: [{ name: work_list, type: std:artifact_types/work_list }]
    outcomes: { planned: success }
  - id: expand
    action: plan.expand
    with:
      from: work_list
      shape: parallel
      target: children
      step: { action: run.child, with: { template: m7steer:templates/steer_line, level: ticket, repositories: "$.repositories" } }
    consumes: [{ name: work_list }]
  - id: children
    parallel: { branches: [], join: all }
    routes: { completed: { end: completed } }
