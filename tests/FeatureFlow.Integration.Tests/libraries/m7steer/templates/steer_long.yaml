api_version: feature-flow/v1
kind: template
metadata:
  name: steer_long
  level: ticket
  description: >-
    Scripted agent steps all started at once, then a build. The short ones grow the history past the hand-over
    threshold while a long one is still running, so the run drains for as long as the long one takes.

parameters:
  work: { type: array, required: true, description: "One agent step per item, which the scripted runtime holds for item milliseconds" }

defaults:
  routes:
    by_class: { failure: { escalate: true }, blocked: { escalate: true } }

steps:
  - id: work
    for_each:
      items: { expr: "params.work" }
      mode: parallel
      step:
        agent: { role: std:roles/reviewer, task: m7steer:tasks/prepare }
        with: { wait_ms: { expr: "item" } }
        outcomes: { prepared: success }
  - id: final
    agent: { role: std:roles/implementer, task: m7steer:tasks/build }
    outcomes: { built: success, stuck: blocked }
    routes: { built: { end: completed } }
