api_version: feature-flow/v1
kind: template
metadata:
  name: steer_long
  level: ticket
  description: A chain of short actions that grows the history past the hand-over threshold, then a build.

parameters:
  work: { type: array, required: true, description: "One action per item, which takes item milliseconds" }

defaults:
  routes:
    by_class: { failure: { escalate: true }, blocked: { escalate: true } }

steps:
  - id: work
    for_each:
      items: { expr: "params.work" }
      mode: chain
      step:
        action: notify.send
        with: { audience: [team], message: work, wait_ms: { expr: "item" } }
  - id: final
    agent: { role: std:roles/implementer, task: m7steer:tasks/build }
    outcomes: { built: success, stuck: blocked }
    routes: { built: { end: completed } }
