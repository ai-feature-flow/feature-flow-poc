api_version: feature-flow/v1
kind: template
metadata:
  name: steer_fan
  level: epic
  description: Two children in parallel; a failed one escalates at the join, and a person may re-run it alone.

defaults:
  routes:
    by_class: { failure: { escalate: true }, blocked: { escalate: true } }

steps:
  - id: fan
    parallel:
      branches:
        - { id: kid_a, action: run.child, with: { template: m7steer:templates/steer_gate, level: ticket, repositories: [acme/api], parameters: {} } }
        - { id: kid_b, action: run.child, with: { template: m7steer:templates/steer_gate, level: ticket, repositories: [acme/api], parameters: {} } }
    routes: { completed: ship, any_failed: { escalate: true } }
  - id: ship
    action: notify.send
    with: { audience: [team], message: shipped }
    routes: { sent: { end: completed } }
