api_version: feature-flow/v1
kind: template
metadata:
  name: warns
  level: ticket
  description: A template declaring a parameter it never reads, so run start lists a check 34 warning.

parameters:
  unused: { type: string, default: "x", description: "Declared and never read" }

steps:
  - id: inspect
    action: repo.inspect
    routes:
      inspected: { end: completed }
