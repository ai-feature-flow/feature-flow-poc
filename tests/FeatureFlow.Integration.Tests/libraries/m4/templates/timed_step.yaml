api_version: feature-flow/v1
kind: template
metadata:
  name: timed_step
  level: ticket
  description: >-
    The agent step of agent_step with a one-minute timeout and one question at the default question timeout,
    for the out-of-time tests.
  branch_pattern: "ff/ticket/{{ params.ticket_id }}"

artifact_types:
  - m4:artifact_types/notes

parameters:
  ticket_id: { type: string, required: true }
  instruction: { type: string, required: true, description: "What the agent is to do" }

defaults:
  routes:
    by_class: { failure: { escalate: true }, blocked: { escalate: true } }

steps:
  - id: implement
    agent:
      role: std:roles/implementer
      task: m4:tasks/agent_task
    with:
      ticket_id: { expr: "params.ticket_id" }
      instruction: { expr: "params.instruction" }
    produces:
      implemented: [{ name: notes, type: m4:artifact_types/notes }]
    outputs: { answer: { type: string } }
    outcomes: { implemented: success, blocked: blocked }
    limits: { attempts: 1, timeout: 1m, questions: { max: 1 } }
    routes:
      implemented: { end: completed }
