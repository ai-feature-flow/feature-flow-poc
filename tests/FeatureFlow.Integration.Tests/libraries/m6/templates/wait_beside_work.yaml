api_version: feature-flow/v1
kind: template
metadata:
  name: wait_beside_work
  level: ticket
  description: >-
    A long ci.checks beside a chain of short actions that grows the history past the
    hand-over threshold, so the run hands over while the wait is open (LOG 139).
  branch_pattern: ff/waits

parameters:
  work: { type: array, required: true, description: "One action per item, which takes item milliseconds" }

defaults:
  routes:
    by_class: { failure: { escalate: true }, blocked: { escalate: true } }

steps:
  - id: both
    parallel:
      join: all
      branches:
        - id: checks
          action: ci.checks
          with: { poll_every: 5s, timeout: 1h }
        - id: work
          for_each:
            items: { expr: "params.work" }
            mode: chain
            step:
              action: notify.send
              with: { audience: [team], message: work, wait_ms: { expr: "item" } }
    routes:
      completed: { end: completed }
