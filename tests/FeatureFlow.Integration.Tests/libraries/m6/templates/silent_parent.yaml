api_version: feature-flow/v1
kind: template
metadata:
  name: silent_parent
  level: epic
  description: >-
    A child beside a chain of short agent steps, each taking its item's
    milliseconds (the fake script's delay_from). The tests end the child without letting it
    signal, before or after a hand-over (M3 follow-up 10).

parameters:
  work: { type: array, required: true, description: "One agent step per item, which takes item milliseconds" }

defaults:
  routes:
    by_class: { failure: { escalate: true }, blocked: { escalate: true } }

steps:
  - id: both
    parallel:
      join: all
      branches:
        - id: child
          action: run.child
          with:
            template: m6:templates/silent_child
            repositories: [acme/api]
        - id: work
          for_each:
            items: { expr: "params.work" }
            mode: chain
            step:
              agent:
                role: std:roles/reviewer
                task: m6:tasks/note
              with: { wait_ms: { expr: "item" } }
              outcomes: { done: success }
    routes:
      completed: { end: completed }
      any_failed: { end: failed }
