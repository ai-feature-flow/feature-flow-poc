# A trial installation for the k3d cluster: the real stores, Temporal and sandbox provider in the cluster, payloads
# encrypted, with fake providers for everything outside it and a scripted agent (which makes no sandbox), so a std
# ticket run completes with no GitHub, tracker or model:
#
#   deploy/k3d/up.sh deploy/k3d/smoke
#
# The cluster tests run against it. A team's installation is in deploy/distribution-template.
api_version: feature-flow/v1
kind: installation
development: true               # fake providers are for development only
temporal:
  address: "temporal.feature-flow.svc:7233"
  namespace: default
  task_queue: feature-flow
  payload_codec: { name: aes_gcm, key_ref: secrets/payload_key }
providers:
  record_store: { default: postgres, instances: { postgres: { connection_ref: secrets/record_store_connection } } }
  artifact_store:
    default: s3
    instances:
      s3:
        bucket: feature-flow
        endpoint: http://minio.feature-flow.svc:9000
        access_key_ref: secrets/object_store_access_key
        secret_key_ref: secrets/object_store_secret_key
  secrets: { default: file, instances: { file: { path: /var/run/secrets/feature-flow/secrets.json } } }
  agent_runtime: { default: scripted, instances: { scripted: { script: script.yaml } } }
  action_stand_in: { default: scripted, instances: { scripted: { script: script.yaml } } }
  sandbox: { default: kubernetes, instances: { kubernetes: { namespace: feature-flow-sandboxes, image: feature-flow-sandbox:dev } } }
  vcs: { instances: { fake: {} } }
  code_host: { instances: { fake: {} } }
  ci: { instances: { fake: {} } }
  tracker: { instances: { fake: {} } }
  validator: { instances: { fake: {} } }
  notifications: { instances: { fake: {} } }
agent_worker:
  listen: "http://0.0.0.0:8481"
  urls: ["http://agent-worker.feature-flow.svc:8481"]
  token_key_ref: secrets/step_token_key
  sandbox_client: /app/sandbox-client/ff-sandbox
api:
  auth: { mode: local_token, token_ref: secrets/api_token, actor: operator, roles: [viewer, approver, steerer, admin] }
