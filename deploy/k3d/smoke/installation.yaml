# A trial installation for the k3d cluster: the real stores and Temporal in the cluster, with fake providers for
# everything outside it and a scripted agent, so a std ticket run completes with no GitHub, tracker or model:
#
#   deploy/k3d/up.sh deploy/k3d/smoke
#
# The cluster tests run against it. A team's installation is in deploy/distribution-template.
api_version: feature-flow/v1
kind: installation
development: true               # fake providers are for development only
temporal: { address: "temporal.feature-flow.svc:7233", namespace: default, task_queue: feature-flow }
providers:
  record_store: { default: sqlite, instances: { sqlite: { path: /tmp/records.db } } }
  artifact_store: { default: filesystem, instances: { filesystem: { root: /tmp/artifacts } } }
  secrets: { default: file, instances: { file: { path: /var/run/secrets/feature-flow/secrets.json } } }
  agent_runtime: { default: scripted, instances: { scripted: { script: script.yaml } } }
  action_stand_in: { default: scripted, instances: { scripted: { script: script.yaml } } }
  sandbox: { instances: { fake: {} } }
  vcs: { instances: { fake: {} } }
  code_host: { instances: { fake: {} } }
  ci: { instances: { fake: {} } }
  tracker: { instances: { fake: {} } }
  validator: { instances: { fake: {} } }
  notifications: { instances: { fake: {} } }
agent_worker:
  listen: "http://0.0.0.0:8481"
  urls: ["http://agent-worker.feature-flow.svc:8481"]
  token_key_ref: secrets/step_token_key
  sandbox_client: /app/sandbox-client/ff-sandbox
api:
  auth: { mode: local_token, token_ref: secrets/api_token, actor: operator, roles: [viewer, approver, steerer, admin] }
